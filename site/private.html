<p><a href="index.html">← 운동 자세 가이드로 돌아가기</a></p>
<h1>개인 기록 확인</h1>
<p class="note">이 페이지는 공개 사이트에 있지만, 개인 기록은 평문이 아니라 아래 암호화 데이터로만 들어 있습니다. 비밀번호를 입력하면 <strong>서버로 보내지 않고 이 브라우저 안에서만</strong> 복호화해 보여줍니다. 페이지를 닫거나 “다시 잠그기”를 누르면 복호화된 내용은 사라집니다. 비밀번호 자체는 이 사이트 어디에도 저장되어 있지 않습니다.</p>
<p class="note">주의: 이 사이트가 공개 사이트라 암호화 데이터 자체는 누구나 내려받을 수 있습니다. 그래서 이 보호는 비밀번호 강도에만 의존합니다.</p>
<form id="unlockForm">
  <label for="pw">비밀번호</label><br>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit">기록 확인</button>
  <p id="msg" role="alert"></p>
</form>
<div id="result">
  <button id="lockBtn" class="secondary" type="button">다시 잠그기</button>
  <div id="content"></div>
</div>

function b64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderMarkdown(md){
  const lines = md.split(/\r?\n/);
  let html = "";
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(line.startsWith("|") && i+1<lines.length && /^\|[\s\-:|]+$/.test(lines[i+1])){
      const head = line.split("|").map(s=>s.trim()).filter(Boolean);
      html += "<table><thead><tr>" + head.map(c=>"<th>"+escapeHtml(c)+"</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while(i<lines.length && lines[i].startsWith("|")){
        const cells = lines[i].split("|").map(s=>s.trim()).filter(Boolean);
        html += "<tr>" + cells.map(c=>"<td>"+escapeHtml(c)+"</td>").join("") + "</tr>";
        i++;
      }
      html += "</tbody></table>";
      i--;
    } else if(line.startsWith("## ")){
      html += "<h2>"+escapeHtml(line.slice(3))+"</h2>";
    } else if(line.startsWith("# ")){
      html += "<h2>"+escapeHtml(line.slice(2))+"</h2>";
    } else if(line.startsWith("- ")){
      html += "<p>• "+escapeHtml(line.slice(2))+"</p>";
    } else if(line.trim()===""){
      // skip
    } else {
      html += "<p>"+escapeHtml(line)+"</p>";
    }
  }
  return html;
}
async function unlock(pw){
  const data = b64ToBytes(ENC_B64);
  const header = String.fromCharCode(...data.slice(0,8));
  if(header !== "Salted__") throw new Error("암호화 형식이 다릅니다.");
  const salt = data.slice(8,16);
  const ct = data.slice(16);
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt: salt, iterations: 10000, hash:"SHA-256"}, keyMaterial, 384);
  const bytes = new Uint8Array(bits);
  const key = await crypto.subtle.importKey("raw", bytes.slice(0,32), "AES-CBC", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-CBC", iv: bytes.slice(32,48)}, key, ct);
  const text = new TextDecoder().decode(plain);
  if(!text.includes("인바디")) throw new Error("비밀번호가 맞지 않습니다.");
  return text;
}
const form = document.getElementById("unlockForm");
const msg = document.getElementById("msg");
const result = document.getElementById("result");
const content = document.getElementById("content");
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  msg.textContent = "";
  const pwInput = document.getElementById("pw");
  const pw = pwInput.value;
  try{
    const text = await unlock(pw);
    content.innerHTML = renderMarkdown(text);
    result.style.display = "block";
    form.style.display = "none";
  }catch(err){
    msg.textContent = "비밀번호가 맞지 않거나 복호화에 실패했습니다. 다시 입력해 주세요.";
  }finally{
    pwInput.value = "";
  }
});
document.getElementById("lockBtn").addEventListener("click", ()=>{
  content.innerHTML = "";
  result.style.display = "none";
  form.style.display = "block";
  document.getElementById("pw").focus();
});
